# This workflow builds and tests the package on macOS and iOS.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # xcodebuild, not `swift test`: the runner's SwiftPM CLI copies Localizable.xcstrings
      # without compiling it, so translations are not found at runtime.
      - name: Build and test (macOS)
        run: xcodebuild test -scheme SwiftyHelpers -destination 'platform=macOS' -skipPackagePluginValidation

  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and test (iOS Simulator)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          # -skipPackagePluginValidation: trust the SwiftLint plugin without the Xcode prompt.
          xcodebuild test -scheme SwiftyHelpers -destination "id=$DEVICE_ID" -skipPackagePluginValidation
